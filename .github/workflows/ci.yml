name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Tests, Typprüfung und Web-Build
        run: npm run build
      - name: Neue Lockdatei einchecken (nur wenn sie noch fehlte)
        if: github.event_name != 'pull_request'
        run: |
          if [ -n "$(git status --porcelain package-lock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898499+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Lockdatei aus CI erzeugt"
            git push
          fi
